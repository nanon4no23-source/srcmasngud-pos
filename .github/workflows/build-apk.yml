name: Build Android APK (SRC MASNGUD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK SRC MASNGUD
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Ambil File dari Repository
        uses: actions/checkout@v4

      - name: 📦 2. Ekstrak File Zip & Cari Direktori Proyek
        run: |
          echo "=== MENGEKSTRAK FILE ZIP PROYEK ==="
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Mengekstrak $f..."
              unzip -q -o "$f" -d extracted_temp
            fi
          done
          if [ -d "extracted_temp" ]; then
            PKG_DIR=$(find extracted_temp -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$PKG_DIR" ]; then
              echo "Menemukan proyek di: $PKG_DIR, menyalin ke root..."
              cp -r $PKG_DIR/* .
              cp -r $PKG_DIR/.* . 2>/dev/null || true
            fi
            rm -rf extracted_temp
          fi

          # Sinkronisasi compileSdk ke 36 agar cocok dengan androidx.activity:1.11.0 & androidx.core:1.17.0
          if [ -f "android/variables.gradle" ]; then
            echo "Memperbarui compileSdkVersion dan targetSdkVersion ke 36..."
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle
            cat android/variables.gradle
          fi

          ls -la

      - name: ☕ 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 4. Setup Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;36.0.0'

      - name: 🟢 5. Install Dependencies & Sinkronisasi Proyek
        run: |
          echo "=== MEMPERSIAPKAN MODUL CAPACITOR ==="
          yes | sdkmanager --licenses 2>/dev/null || true

          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || npm i -D @capacitor/android@8.3.4 @capacitor/core@8.3.4 || true
          fi

          # Bersihkan sisa package lama jika ada
          rm -rf android/app/src/main/java/com/arapos 2>/dev/null || true

          # Sinkronisasi capacitor-android
          mkdir -p android/capacitor-android
          if [ -d "node_modules/@capacitor/android/capacitor" ]; then
            cp -rn node_modules/@capacitor/android/capacitor/* android/capacitor-android/ 2>/dev/null || true
          fi

          # Pastikan capacitor.settings.gradle dapat menemukan modul Capacitor
          if [ -f "android/capacitor.settings.gradle" ]; then
            python3 -c "open('android/capacitor.settings.gradle','w').write(\"include ':capacitor-android'\\nif (new File('../node_modules/@capacitor/android/capacitor').exists()) {\\n    project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')\\n} else {\\n    project(':capacitor-android').projectDir = new File('./capacitor-android')\\n}\\n\")"
          fi

          # Pastikan cdvPluginPostBuildExtras terdefinisi agar tidak null di cordova-plugins
          if [ -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            grep -q "cdvPluginPostBuildExtras" android/capacitor-cordova-android-plugins/cordova.variables.gradle || echo "ext.cdvPluginPostBuildExtras = []" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
          fi

          # Konfigurasi Java 21 di build.gradle jika belum ada
          if [ -f "android/app/build.gradle" ]; then
            python3 -c "p='android/app/build.gradle'; c=open(p).read(); 'VERSION_21' in c or open(p,'w').write(c.replace('buildTypes {','compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }\\n    buildTypes {'))" 2>/dev/null || true
          fi

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-8.11.1-all.zip/gradle-8.14.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: 🔑 6. Berikan Izin Eksekusi Gradle Wrapper
        run: |
          if [ -d "android" ]; then
            cd android
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: 🔨 7. Kompilasi Android Debug APK
        run: |
          echo "=== MEMULAI PROSES BUILD GRADLE ==="
          if [ -d "android" ]; then
            cd android
          fi
          ./gradlew :app:assembleDebug --no-daemon -x lint -x test -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: 📋 8. Siapkan File APK Hasil Build
        run: |
          mkdir -p output_apk
          echo "Mencari file APK yang dihasilkan..."
          find . -type f -name "*.apk"
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "APK ditemukan di: $APK_PATH"
            cp "$APK_PATH" output_apk/srcmasngud-kasir-v1.0.apk
            echo "File APK berhasil disalin ke output_apk/srcmasngud-kasir-v1.0.apk"
            ls -lh output_apk/
          else
            echo "Error: File APK tidak ditemukan di seluruh direktori!"
            exit 1
          fi

      - name: 🚀 9. Upload File APK ke Artifacts (Siap Download di GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: SRCMASNGUD-Kasir-APK
          path: output_apk/srcmasngud-kasir-v1.0.apk
          retention-days: 30
