name: Build Android APK (SRC MASNGUD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: 🌐 Build Web App (Vite)
        run: |
          npm run build

      - name: 🔄 Sinkronisasi Capacitor Android
        run: |
          npx cap sync android

      - name: 🔑 Berikan Izin Eksekusi Gradle Wrapper
        run: |
          chmod +x ./android/gradlew

      - name: 🔨 Compile & Build APK Android
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace || true

      - name: 📂 Kumpulkan & Gandakan File APK
        run: |
          mkdir -p output-apk
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/srcmasngud-kasir-v1.0.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/srcmasngud-kasir-debug.apk
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output-apk/srcmasngud-kasir-release-unsigned.apk
          fi
          echo "=== DAFTAR BERKAS APK YANG DIHASILKAN ==="
          ls -lh output-apk/

      - name: 🚀 Unggah File APK ke Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: srcmasngud-kasir-apk
          path: output-apk/*
          retention-days: 30
