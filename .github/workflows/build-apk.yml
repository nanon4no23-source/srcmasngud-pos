name: Build Android APK (SRC MASNGUD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Ekstrak ZIP & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 2. Ekstrak File ZIP (Otomatis jika ada ZIP di repo)
        run: |
          echo "=== MEMERIKSA FILE ZIP PROYEK ==="
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Menemukan file zip: $ZIP_FILE"
            echo "Sedang mengekstrak seluruh file proyek..."
            unzip -o -q "$ZIP_FILE"
            echo "Ekstraksi berhasil!"
          else
            echo "File proyek sudah diekstrak / tidak berupa ZIP tunggal."
          fi

          if [ ! -d "android" ]; then
            NESTED_ANDROID=$(find . -mindepth 2 -maxdepth 3 -type d -name "android" | head -n 1)
            if [ -n "$NESTED_ANDROID" ]; then
              PARENT_DIR=$(dirname "$NESTED_ANDROID")
              echo "Memindahkan folder dari subdirektori $PARENT_DIR ke root..."
              cp -rn "$PARENT_DIR"/* . 2>/dev/null || true
            fi
          fi

          echo "Daftar direktori proyek:"
          ls -la

      - name: ☕ 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 5. Setup Node.js & Install Capacitor Dependencies
        run: |
          echo "=== MEMPERSIAPKAN NODE & DEPENDENCIES ==="
          yes | sdkmanager --licenses 2>/dev/null || true

          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || npm install --force || npm i -D @capacitor/android@8.3.4 @capacitor/core@8.3.4
          else
            npm i -D @capacitor/android@8.3.4 @capacitor/core@8.3.4
          fi

          mkdir -p android/capacitor-android
          if [ -d "node_modules/@capacitor/android/capacitor" ]; then
            cp -rn node_modules/@capacitor/android/capacitor/* android/capacitor-android/ 2>/dev/null || true
            echo "Modul Capacitor Android berhasil disinkronkan!"
          fi

          if [ -f "android/capacitor.settings.gradle" ]; then
            cat << 'EOF' > android/capacitor.settings.gradle
include ':capacitor-android'
if (new File('../node_modules/@capacitor/android/capacitor').exists()) {
    project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
} else {
    project(':capacitor-android').projectDir = new File('./capacitor-android')
}
EOF
          fi

          python3 -c "
import os
path = 'android/app/build.gradle'
if os.path.exists(path):
    with open(path, 'r') as f:
        c = f.read()
    if 'VERSION_21' not in c:
        if 'compileOptions {' in c:
            c = c.replace('compileOptions {', 'compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n')
        elif 'buildTypes {' in c:
            c = c.replace('buildTypes {', 'compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n    }\n    buildTypes {')
        with open(path, 'w') as f:
            f.write(c)
        print('Patch Java 21 ke android/app/build.gradle berhasil!')
"

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-8.11.1-all.zip/gradle-8.14.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: 🔑 6. Berikan Izin Eksekusi Gradle Wrapper
        run: |
          echo "=== MEMERIKSA PERIZINAN GRADLE WRAPPER ==="
          if [ -d "android" ]; then
            cd android
          fi
          chmod +x gradlew 2>/dev/null || true
          ls -lh gradlew gradle/wrapper/

      - name: 🔨 7. Kompilasi Android Debug APK
        run: |
          echo "=== MEMULAI PROSES BUILD GRADLE ==="
          if [ -d "android" ]; then
            cd android
          fi
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📋 8. Siapkan File APK Hasil Build
        run: |
          mkdir -p output_apk
          APK_PATH=$(find . -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "APK ditemukan di: $APK_PATH"
            cp "$APK_PATH" output_apk/srcmasngud-kasir-v1.0.apk
            echo "File APK berhasil disalin ke output_apk/srcmasngud-kasir-v1.0.apk"
            ls -lh output_apk/
          else
            echo "Error: File APK tidak ditemukan!"
            exit 1
          fi

      - name: 🚀 9. Upload File APK ke Artifacts (Siap Download di GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: srcmasngud-kasir-apk
          path: output_apk/srcmasngud-kasir-v1.0.apk
          retention-days: 30
