name: Build Android APK (SRC MASNGUD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: 📦 Ekstrak Berkas ZIP (Jika Perlu)
        run: |
          echo "=== MEMERIKSA BERKAS DI REPOSITORI ==="
          ls -la
          # Jika folder android belum ada, ekstrak dari file zip
          if [ ! -d "android" ]; then
            for z in *.zip; do
              if [ -f "$z" ]; then
                echo "Mengekstrak berkas $z..."
                unzip -q -o "$z" || true
              fi
            done
          fi
          # Bersihkan file zip yang ada di folder assets android agar tidak membebani kompilasi
          rm -f android/app/src/main/assets/public/*.zip 2>/dev/null || true
          echo "=== STRUKTUR SETELAH PEMERIKSAAN ==="
          ls -la

      - name: 🔍 Deteksi Lokasi Proyek (Root atau Subfolder)
        id: locate-project
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            WORKDIR=$(dirname "$PKG_PATH")
            echo "workdir=$WORKDIR" >> $GITHUB_OUTPUT
            echo "Folder proyek ditemukan di: $WORKDIR"
          else
            echo "workdir=." >> $GITHUB_OUTPUT
            echo "Menggunakan direktori root (.)"
          fi

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'

      - name: 📦 Install Node Dependencies
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          npm install --legacy-peer-deps --no-audit || npm install --force || true

      - name: 🌐 Build Web App & Sync ke Android
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          # Build Vite Web App
          npm run build || echo "⚠️ Build Vite dilewati, menggunakan berkas aset web yang sudah ada"
          if [ -d "dist" ]; then
            npx cap copy android || true
          fi
          # Pastikan tidak ada file zip cadangan di dalam bundle assets android
          rm -f android/app/src/main/assets/public/*.zip 2>/dev/null || true

      - name: 🔑 Berikan Izin Eksekusi Gradle Wrapper
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          chmod +x ./android/gradlew || true

      - name: 🔨 Compile & Build APK Android
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: 📂 Kumpulkan & Gandakan File APK
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          mkdir -p output-apk
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/srcmasngud-kasir-v2.1.apk
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output-apk/srcmasngud-kasir-release-unsigned.apk
          fi
          echo "=== BERKAS APK HASIL BUILD ==="
          ls -lh output-apk/

      - name: 🚀 Unggah File APK ke Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: srcmasngud-kasir-apk
          path: ${{ steps.locate-project.outputs.workdir }}/output-apk/*
          retention-days: 30
