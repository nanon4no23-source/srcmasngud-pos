name: Build Android APK Otomatis

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Unduh & Ekstrak Proyek Android
        run: |
          echo "Mengunduh file proyek Android..."
          curl -L -f -o project.zip "https://ais-pre-whx5yzizrgfyiwu5u6r4wj-464365808003.asia-southeast1.run.app/srcmasngud-android.zip"
          unzip -q project.zip
          
          # Jika hasil ekstrak berada di dalam subfolder android, pindahkan ke root:
          if [ -d "android" ]; then
            cp -r android/* .
          fi
          
          chmod +x gradlew
          ls -la

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK dengan Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Simpan File APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SRCMASNGUD-Kasir-APK
          path: app/build/outputs/apk/debug/app-debug.apk
