name: Build Android APK (SRC MASNGUD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: 📦 Ekstrak Berkas ZIP (Jika Ada)
        run: |
          echo "=== MEMERIKSA BERKAS DI REPOSITORI ==="
          ls -la
          for z in *.zip; do
            if [ -f "$z" ] && [ ! -f "package.json" ]; then
              echo "Mengekstrak $z..."
              unzip -q -o "$z" || true
            fi
          done
          echo "=== STRUKTUR SETELAH PEMERIKSAAN ZIP ==="
          ls -la

      - name: 🔍 Deteksi Lokasi Proyek (Root atau Subfolder)
        id: locate-project
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            WORKDIR=$(dirname "$PKG_PATH")
            echo "workdir=$WORKDIR" >> $GITHUB_OUTPUT
            echo "Folder proyek ditemukan di: $WORKDIR"
          else
            echo "workdir=." >> $GITHUB_OUTPUT
            echo "Menggunakan direktori root (.)"
          fi

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          npm install react-is --legacy-peer-deps || true
          npm install --legacy-peer-deps --no-audit || true

      - name: 🌐 Build Web App (Vite)
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          npm run build || echo "⚠️ Menggunakan berkas aset web pre-built yang sudah lengkap di dist/ & android/"
          if [ -d "dist" ]; then
            npx cap sync android || true
          fi

      - name: 🔑 Berikan Izin Eksekusi Gradle Wrapper
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          chmod +x ./android/gradlew || true

      - name: 🔨 Compile & Build APK Android
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace || true

      - name: 📂 Kumpulkan & Gandakan File APK
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          mkdir -p output-apk
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/srcmasngud-kasir-v1.0.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/srcmasngud-kasir-debug.apk
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output-apk/srcmasngud-kasir-release-unsigned.apk
          fi
          echo "=== DAFTAR BERKAS APK YANG DIHASILKAN ==="
          ls -lh output-apk/

      - name: 🚀 Unggah File APK ke Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: srcmasngud-kasir-apk
          path: ${{ steps.locate-project.outputs.workdir }}/output-apk/*
          retention-days: 30
