name: Build Android APK Otomatis

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil File dari Repository
        uses: actions/checkout@v4

      - name: Ekstrak Proyek Android
        run: |
          unzip -q srcmasngud-android.zip
          
          # Rapikan struktur folder jika berada dalam subfolder android
          if [ -d "android" ]; then
            cp -r android/* .
          fi
          
          chmod +x gradlew
          ls -la

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK dengan Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Simpan File APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SRCMASNGUD-Kasir-APK
          path: app/build/outputs/apk/debug/app-debug.apk
