name: Build Android APK (SRC MASNGUD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK SRC MASNGUD
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Ambil File dari Repository
        uses: actions/checkout@v4

      - name: 📦 2. Ekstrak File Zip & Cari Direktori Proyek
        run: |
          echo "=== MENGEKSTRAK FILE ZIP PROYEK ==="
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Mengekstrak $f..."
              unzip -q -o "$f" -d extracted_temp
            fi
          done
          if [ -d "extracted_temp" ]; then
            PKG_DIR=$(find extracted_temp -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$PKG_DIR" ]; then
              echo "Menemukan proyek di: $PKG_DIR, menyalin ke root..."
              cp -r $PKG_DIR/* .
              cp -r $PKG_DIR/.* . 2>/dev/null || true
            fi
            rm -rf extracted_temp
          fi
          ls -la

      - name: 🟢 3. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 4. Install Dependencies & Build Web
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps
          npm run build

      - name: ☕ 5. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🤖 6. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 7. Setup Gradle Resmi (8.14.3)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 🔨 8. Sinkronkan Web & Kompilasi APK
        run: |
          echo "=== MENYINKRONKAN DENGAN CAPACITOR ==="
          npx cap sync android
          
          echo "=== MEMULAI KOMPILASI GRADLE RESMI ==="
          cd android
          gradle assembleDebug --no-daemon

      - name: 🚀 9. Simpan File APK ke Artifacts (Siap Download)
        uses: actions/upload-artifact@v4
        with:
          name: SRCMASNGUD-Kasir-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
