name: Build Android APK (SRC MASNGUD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Ekstrak ZIP & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 2. Ekstrak File ZIP (Otomatis jika ada ZIP di repo)
        run: |
          echo "=== MEMERIKSA FILE ZIP PROYEK ==="
          # Cari file zip jika diunggah dalam bentuk ZIP
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Menemukan file zip: $ZIP_FILE"
            echo "Sedang mengekstrak seluruh file proyek..."
            unzip -o -q "$ZIP_FILE"
            echo "Ekstraksi berhasil!"
          else
            echo "File proyek sudah diekstrak / tidak berupa ZIP tunggal."
          fi

          # Pastikan folder android berada di root direktori
          if [ ! -d "android" ]; then
            NESTED_ANDROID=$(find . -mindepth 2 -maxdepth 3 -type d -name "android" | head -n 1)
            if [ -n "$NESTED_ANDROID" ]; then
              PARENT_DIR=$(dirname "$NESTED_ANDROID")
              echo "Memindahkan folder dari subdirektori $PARENT_DIR ke root..."
              cp -rn "$PARENT_DIR"/* . 2>/dev/null || true
            fi
          fi

          echo "Daftar direktori proyek:"
          ls -la

      - name: ☕ 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 5. Siapkan Gradle Wrapper Resmi
        run: |
          echo "=== MEMPERSIAPKAN GRADLE WRAPPER ==="
          if [ -d "android" ]; then
            cd android
          fi
          # Buat wrapper resmi secara otomatis menggunakan gradle bawaan sistem
          gradle wrapper --gradle-version 8.11.1 --distribution-type all || true
          chmod +x gradlew 2>/dev/null || true

      - name: 🔨 6. Kompilasi Android Debug APK
        run: |
          echo "=== MEMULAI PROSES BUILD GRADLE ==="
          if [ -d "android" ]; then
            cd android
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: 📋 7. Siapkan File APK Hasil Build
        run: |
          mkdir -p output_apk
          # Cari file APK yang berhasil diciptakan oleh Gradle
          APK_PATH=$(find . -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "APK ditemukan di: $APK_PATH"
            cp "$APK_PATH" output_apk/srcmasngud-kasir-v1.0.apk
            echo "File APK berhasil disalin ke output_apk/srcmasngud-kasir-v1.0.apk"
            ls -lh output_apk/
          else
            echo "Error: File APK tidak ditemukan!"
            exit 1
          fi

      - name: 🚀 8. Upload File APK ke Artifacts (Siap Download di GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: srcmasngud-kasir-apk
          path: output_apk/srcmasngud-kasir-v1.0.apk
          retention-days: 30
