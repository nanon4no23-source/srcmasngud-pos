name: Build Android APK dari Full Project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil File dari Repository
        uses: actions/checkout@v4

      - name: Ekstrak File Zip & Cari Direktori Proyek
        run: |
          echo "=== Mencari file zip di repo ==="
          ls -la
          
          # Ekstrak file zip apa pun yang ada di repo
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Mengekstrak $f..."
              unzip -q -o "$f"
            fi
          done

          # Jika package.json ada di dalam subfolder, salin isinya ke folder utama
          if [ ! -f "package.json" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -exec dirname {} \;)
            if [ -n "$SUBDIR" ]; then
              echo "Menemukan proyek di dalam: $SUBDIR, memindahkan ke root..."
              cp -r $SUBDIR/* .
            fi
          fi

          echo "=== Memeriksa package.json ==="
          ls -la package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Siapkan Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK dengan Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Simpan File APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SRCMASNGUD-Kasir-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
