name: Build Android APK (SRC MASNGUD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Ekstrak ZIP & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 2. Ekstrak File ZIP (Otomatis jika ada ZIP di repo)
        run: |
          echo "=== MEMERIKSA FILE ZIP PROYEK ==="
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Menemukan file zip: $ZIP_FILE"
            echo "Sedang mengekstrak seluruh file proyek..."
            unzip -o -q "$ZIP_FILE"
            echo "Ekstraksi berhasil!"
          fi

          if [ ! -d "android" ]; then
            NESTED_ANDROID=$(find . -mindepth 2 -maxdepth 3 -type d -name "android" | head -n 1)
            if [ -n "$NESTED_ANDROID" ]; then
              PARENT_DIR=$(dirname "$NESTED_ANDROID")
              echo "Memindahkan folder dari subdirektori $PARENT_DIR ke root..."
              cp -rn "$PARENT_DIR"/* . 2>/dev/null || true
            fi
          fi

          ls -la

      - name: ☕ 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 5. Install Dependencies & Sinkronisasi Proyek
        run: |
          echo "=== MEMPERSIAPKAN MODUL CAPACITOR & GRADLE ==="
          yes | sdkmanager --licenses 2>/dev/null || true

          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || npm i -D @capacitor/android@8.3.4 @capacitor/core@8.3.4 || true
          fi

          if [ -d "node_modules/@capacitor/android/capacitor" ] && [ ! -d "android/capacitor-android" ]; then
            mkdir -p android/capacitor-android
            cp -rn node_modules/@capacitor/android/capacitor/* android/capacitor-android/ 2>/dev/null || true
          fi

          if [ -f "android/app/build.gradle" ]; then
            python3 -c "p='android/app/build.gradle'; c=open(p).read(); 'VERSION_21' in c or open(p,'w').write(c.replace('buildTypes {','compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }\n    buildTypes {'))" 2>/dev/null || true
          fi

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-8.11.1-all.zip/gradle-8.14.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: 🔑 6. Berikan Izin Eksekusi Gradle Wrapper
        run: |
          echo "=== MEMERIKSA PERIZINAN GRADLE WRAPPER ==="
          if [ -d "android" ]; then
            cd android
          fi
          chmod +x gradlew 2>/dev/null || true
          ls -lh gradlew gradle/wrapper/

      - name: 🔨 7. Kompilasi Android Debug APK
        run: |
          echo "=== MEMULAI PROSES BUILD GRADLE ==="
          if [ -d "android" ]; then
            cd android
          fi
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📋 8. Siapkan File APK Hasil Build
        run: |
          mkdir -p output_apk
          APK_PATH=$(find . -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "APK ditemukan di: $APK_PATH"
            cp "$APK_PATH" output_apk/srcmasngud-kasir-v1.0.apk
            echo "File APK berhasil disalin ke output_apk/srcmasngud-kasir-v1.0.apk"
            ls -lh output_apk/
          else
            echo "Error: File APK tidak ditemukan!"
            exit 1
          fi

      - name: 🚀 9. Upload File APK ke Artifacts (Siap Download di GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: srcmasngud-kasir-apk
          path: output_apk/srcmasngud-kasir-v1.0.apk
          retention-days: 30
