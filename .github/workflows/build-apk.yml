name: Build Android APK Otomatis

on:
  workflow_dispatch: # Memungkinkan tombol "Run workflow" ditekan kapan saja

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download & Extract Project Android Langsung
        run: |
          echo "Mengunduh paket proyek Android..."
          curl -L -o project.zip "https://ais-dev-whx5yzizrgfyiwu5u6r4wj-464365808003.asia-southeast1.run.app/srcmasngud-android.zip"
          unzip -q project.zip
          chmod +x gradlew
          ls -la

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK dengan Gradle
        run: ./gradlew assembleDebug

      - name: Simpan File APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SRCMASNGUD-Kasir-APK
          path: app/build/outputs/apk/debug/app-debug.apk
