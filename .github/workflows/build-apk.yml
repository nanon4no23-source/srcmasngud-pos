name: Build Android APK (SRC MASNGUD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: 📦 Ekstrak Otomatis Berkas ZIP (Jika Ada)
        run: |
          echo "Memeriksa berkas arsip zip di repositori..."
          if [ -f "srcmasngud-full-project.zip" ]; then
            echo "✅ Ditemukan srcmasngud-full-project.zip, mengekstrak otomatis..."
            unzip -q -o srcmasngud-full-project.zip
          fi
          # Periksa juga jika nama zip lain diunggah
          for z in *.zip; do
            if [ -f "$z" ] && [ ! -f "package.json" ]; then
              echo "Mengekstrak $z..."
              unzip -q -o "$z"
            fi
          done

      - name: 🔍 Deteksi Lokasi Proyek
        id: locate-project
        run: |
          echo "=== STRUKTUR FOLDER SETELAH EKSTRAK ==="
          ls -la
          
          # Cari lokasi package.json
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PKG_PATH" ]; then
            echo "❌ Eror: berkas package.json tidak ditemukan bahkan setelah ekstraksi!"
            exit 1
          fi
          
          WORKDIR=$(dirname "$PKG_PATH")
          echo "Ditemukan package.json di folder: $WORKDIR"
          echo "workdir=$WORKDIR" >> $GITHUB_OUTPUT

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps react-is
          npm install --legacy-peer-deps
      - name: 🌐 Build Web App (Vite)
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          npm run build

      - name: 🔄 Sinkronisasi atau Inisialisasi Android
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          if [ ! -d "android" ]; then
            echo "Direktori android tidak ditemukan, otomatis membuat dengan npx cap add android..."
            npx cap add android
          fi
          npx cap sync android

      - name: 🔑 Berikan Izin Eksekusi Gradle Wrapper
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          chmod +x ./android/gradlew || true

      - name: 🔨 Compile & Build APK Android
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace || true

      - name: 📂 Kumpulkan & Gandakan File APK
        working-directory: ${{ steps.locate-project.outputs.workdir }}
        run: |
          mkdir -p output-apk
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/srcmasngud-kasir-v1.0.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/srcmasngud-kasir-debug.apk
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output-apk/srcmasngud-kasir-release-unsigned.apk
          fi
          echo "=== DAFTAR BERKAS APK YANG DIHASILKAN ==="
          ls -lh output-apk/

      - name: 🚀 Unggah File APK ke Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: srcmasngud-kasir-apk
          path: ${{ steps.locate-project.outputs.workdir }}/output-apk/*
          retention-days: 30
