name: Build Android APK dari Full Project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil File dari Repository
        uses: actions/checkout@v4

      - name: Ekstrak File Zip & Cari Direktori Proyek
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Mengekstrak $f..."
              unzip -q -o "$f" -d extracted_temp
            fi
          done

          if [ -d "extracted_temp" ]; then
            PKG_DIR=$(find extracted_temp -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$PKG_DIR" ]; then
              echo "Menemukan proyek di: $PKG_DIR, menyalin ke root..."
              cp -r $PKG_DIR/* .
              cp -r $PKG_DIR/.* . 2>/dev/null || true
            fi
            rm -rf extracted_temp
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps
          npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sinkronkan Web & Pastikan Wrapper Asli & Build APK
        run: |
          # Sinkronkan web terbaru ke Android
          npx cap sync android

          cd android
          # Pastikan file jar wrapper resmi yang valid selalu terpasang
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

          # Jalankan build APK Debug
          ./gradlew assembleDebug --no-daemon

      - name: Simpan File APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SRCMASNGUD-Kasir-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
